name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "orion/main"
    tags:
      - "android-v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: sec
    env:
      VITE_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Validate build configuration
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "Set repository variable RENDER_API_BASE_URL"; exit 1; }

      - run: npm ci
      - run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk monthly-spend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-spend-android-${{ github.sha }}
          path: monthly-spend.apk
          retention-days: 14

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: monthly-spend.apk
          generate_release_notes: true
