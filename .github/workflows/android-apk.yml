name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: sec
    env:
      VITE_API_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Validate build configuration
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "Set repository variable RENDER_API_BASE_URL"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Set Android signing secrets"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Set ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Set ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Set ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore signing key
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks

      - name: Validate signing key
        run: |
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null || {
              echo "The keystore, password, or alias in the sec environment do not match."
              exit 1
            }

      - run: npm ci
      - run: npm run android:sync

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk monthly-spend.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monthly-spend-android
          path: monthly-spend.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: monthly-spend.apk
          generate_release_notes: true
