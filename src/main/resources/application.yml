server:
  port: ${PORT:8080}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  error:
    include-message: never

app:
  spreadsheet-id: ${SPREADSHEET_ID:1TpB2iMLGiJzzz2trmitq2hGZLDOQ120gndDJuDqLBJk}
  sheet-name: "${SHEET_NAME:Monthy Spend }"
  access-token: ${APP_ACCESS_TOKEN:change-me-before-running}
  google-credentials-json: ${GOOGLE_CREDENTIALS_JSON:}
  google-credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:credentials.json}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://localhost}
  receipt-folder-id: ${GOOGLE_DRIVE_RECEIPT_FOLDER_ID:}
  food-receipt-folder-id: ${GOOGLE_DRIVE_FOOD_FOLDER_ID:}
  spend-receipt-folder-id: ${GOOGLE_DRIVE_SPEND_FOLDER_ID:}

logging:
  level:
    root: INFO
    app.monthlyspend: INFO
